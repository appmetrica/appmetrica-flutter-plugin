allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.set(newBuildDir)

subprojects {
    project.layout.buildDirectory.set(newBuildDir.dir(project.name))
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        subproject.androidComponents.finalizeDsl { ext ->
            ext.compileSdk = rootProject.project(":app").android.compileSdk
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
